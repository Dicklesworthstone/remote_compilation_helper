name: Rsync issue 91 validation
on:
  push:
    branches: [automation/rsync-91-validation]
permissions:
  contents: read
jobs:
  source:
    runs-on: macos-14
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Snapshot current sources for transport validation
        run: |
          git rev-parse HEAD > source-head.txt
          git archive --format=tar HEAD > source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: rsync-91-source
          path: |
            source.tar
            source-head.txt
          retention-days: 1
