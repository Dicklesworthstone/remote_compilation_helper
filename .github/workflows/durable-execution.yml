name: Durable execution recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rch/src/transfer.rs'
      - 'scripts/tests/test_durable_execution.py'
      - '.github/workflows/durable-execution.yml'

permissions:
  contents: read

jobs:
  # One-shot, exact-blob repair of the large transfer module. The source change
  # removes the receipt-only wait identified by bd-t5c8p; the native formatter
  # and process tests must pass before a non-force push. This job removes itself
  # in that same commit, leaving only read-only regression coverage below.
  land-reviewed-repair:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[bd-t5c8p-land-v1]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply only the reviewed supervisor-loss change
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object rch/src/transfer.rs)" = e526b7541cdce2afb1370051143c79af74c543da
          test "$(git rev-parse HEAD:.github/workflows/durable-execution.yml)" = "$(git rev-parse "$GITHUB_SHA":.github/workflows/durable-execution.yml)"
          cat > "$RUNNER_TEMP/durable-receipt.patch" <<'PATCH'
          --- a/rch/src/transfer.rs
          +++ b/rch/src/transfer.rs
          @@ -22,8 +22,12 @@
                          [ -n \"$d\" ] && {{ echo done > \"$2\"; return 0; }}; sleep 0.2 2>/dev/null || sleep 1; done; }}; \
                        rch_follow {out} {out_progress} & a=$!; rch_follow {err} {err_progress} >&2 & b=$!; \
                        trap 'kill \"$a\" \"$b\" 2>/dev/null || :' EXIT; \
          -             while [ ! -f {done} ]; do sleep 1; done; \
                        wait \"$p\" || :; \
          +             if [ ! -f {done} ] || [ -L {done} ]; then \
          +               kill \"$a\" \"$b\" 2>/dev/null || :; \
          +               wait \"$a\" || :; a=; wait \"$b\" || :; b=; \
          +               echo 'RCH: remote supervisor exited without a durable completion; execution outcome remains unconfirmed' >&2; \
          +               exit 255; fi; \
                        last=; still=0; \
                        while [ \"$(cat {out_progress} {err_progress})\" != \"$(printf 'done\\ndone')\" ]; do \
                          now=$(cat {out_progress} {err_progress}); \
          PATCH
          git apply --check --whitespace=error-all "$RUNNER_TEMP/durable-receipt.patch"
          git apply --whitespace=error-all "$RUNNER_TEMP/durable-receipt.patch"
          git diff --check
      - name: Compile the actual formatter and exercise owned processes
        run: python3 scripts/tests/test_durable_execution.py --native
      - name: Land the tested fix and leave a read-only workflow
        shell: bash
        run: |
          set -euo pipefail
          cat > .github/workflows/durable-execution.yml <<'WORKFLOW'
          name: Durable execution recovery
          on:
            workflow_dispatch:
            push:
              branches: [main]
              paths:
                - 'rch/src/transfer.rs'
                - 'scripts/tests/test_durable_execution.py'
                - '.github/workflows/durable-execution.yml'
          permissions:
            contents: read
          jobs:
            supervisor-recovery:
              runs-on: ubuntu-latest
              timeout-minutes: 10
              steps:
                - uses: actions/checkout@v4
                  with:
                    persist-credentials: false
                - name: Compile the actual formatter and exercise owned processes
                  run: python3 scripts/tests/test_durable_execution.py --native
          WORKFLOW
          test "$(git diff --name-only)" = "$(printf '%s\n' '.github/workflows/durable-execution.yml' 'rch/src/transfer.rs')"
          git diff --check
          git add -- rch/src/transfer.rs .github/workflows/durable-execution.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(transfer): release stranded log followers after supervisor loss (bd-t5c8p)' -m 'Wait for the owned supervisor process, not indefinitely for a receipt it may never publish. On missing completion stop and join only the log followers, retain receipts and the started claim, and report unconfirmed execution (255). Surviving workload descendants retain their inherited activity lock; no command is replayed and no durable ownership is released by this path.' -m 'Validation: seven process-level regressions passed using the actual Rust formatter compiled in isolation. Includes abrupt supervisor death, failed receipt write, blocked client, surviving workload, exact streams/status/umask, large dual streams and duplicate-launch prevention. Full workspace and real SSH/recovery integration remain unverified. Remove the one-shot write-capable landing job; retain read-only regression coverage.'
          git push origin HEAD:refs/heads/main
  supervisor-recovery:
    if: github.event_name != 'workflow_dispatch' && !contains(github.event.head_commit.message, '[bd-t5c8p-land-v1]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile the actual formatter and exercise owned processes
        run: python3 scripts/tests/test_durable_execution.py --native
