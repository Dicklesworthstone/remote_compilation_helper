name: Rsync path arguments

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rsync-paths.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    # The Linux/macOS validation runs remain queued separately. This fallback
    # only prepares exact source blobs; it never commits or updates a branch.
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: stable
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply the exact reviewed patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          expected = {
              'rch/src/transfer.rs': '95c5756fcafa8b7eab8f11e6111234c8d32639d1',
              'rch-common/src/rsync_flavor.rs': 'eba097d2288e9e84114ec63917c9d4d6e1813287',
              'rch-common/src/remote_compilation.rs': 'c2ee1558453dd9e32fb448a25aece5a76acdc34e',
              'rch-common/src/remote_verification.rs': '2b5e15a61509e31bd2c6c1257098c709dd8aa640',
              'rch-common/src/e2e/verification.rs': '3104585a4d49fc25227aa66f14e404de03f8d1d5',
          }
          for path, sha in expected.items():
              actual = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              assert actual == sha, (path, actual, sha)
          payload = bytearray()
          for sha in ['2dce7749562e1584955af9e9933361afe6d40279',
                      'fae47b15cda1de7052d753805c7af4d7bb4aa03a',
                      '59f8e98f8e2f197d12d8f3b288c9e53f3c3c2958']:
              url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs/{sha}"
              request = urllib.request.Request(url, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
              })
              with urllib.request.urlopen(request, timeout=30) as response:
                  blob = json.load(response)
              data = base64.b64decode(blob['content'])
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha
              payload.extend(data)
          patch = pathlib.Path(os.environ['RUNNER_TEMP']) / 'issue91.patch'
          patch.write_bytes(payload)
          subprocess.run(['git', 'apply', '--check', str(patch)], check=True)
          subprocess.run(['git', 'apply', str(patch)], check=True)
          PY
      - name: Format the five Rust files
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustfmt --edition 2024 --config skip_children=true rch/src/transfer.rs rch-common/src/rsync_flavor.rs rch-common/src/remote_compilation.rs rch-common/src/remote_verification.rs rch-common/src/e2e/verification.rs
          git diff --check
      - name: Stage formatted source blobs without publishing a commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, json, os, pathlib, shutil, subprocess, urllib.request
          paths = ['rch/src/transfer.rs', 'rch-common/src/rsync_flavor.rs',
                   'rch-common/src/remote_compilation.rs', 'rch-common/src/remote_verification.rs',
                   'rch-common/src/e2e/verification.rs']
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          assert set(changed) <= set(paths), changed
          evidence = pathlib.Path(os.environ['RUNNER_TEMP']) / 'issue91-evidence'
          evidence.mkdir(exist_ok=True)
          entries = []
          for path in paths:
              data = pathlib.Path(path).read_bytes()
              payload = json.dumps({'encoding': 'base64', 'content': base64.b64encode(data).decode()}).encode()
              url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs"
              request = urllib.request.Request(url, data=payload, method='POST', headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json',
              })
              with urllib.request.urlopen(request, timeout=60) as response:
                  blob = json.load(response)
              assert blob['sha'] == subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
              target = evidence / path
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(path, target)
          report = {'base_sha': os.environ['GITHUB_SHA'], 'files': entries,
                    'validation': 'rustfmt and diff checks passed; tests are recorded separately'}
          (evidence / 'prepared.json').write_text(json.dumps(report, indent=2) + '\n')
          (evidence / 'prepared.patch').write_bytes(subprocess.check_output(['git', 'diff', '--binary']))
          print(json.dumps(report, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rsync-prepared-windows-${{ github.sha }}
          path: ${{ runner.temp }}/issue91-evidence
          retention-days: 7
      - name: Compile and test the exact production rsync module
        run: |
          mkdir -p "$RUNNER_TEMP/rsync-path-tests/src" "$RUNNER_TEMP/rsync-path-test-logs"
          cp rch-common/src/rsync_flavor.rs "$RUNNER_TEMP/rsync-path-tests/src/lib.rs"
          cat > "$RUNNER_TEMP/rsync-path-tests/Cargo.toml" <<'TOML'
          [package]
          name = "rch-rsync-path-validation"
          version = "0.0.0"
          edition = "2024"
          [dependencies]
          serde = { version = "1", features = ["derive"] }
          thiserror = "2"
          shell-escape = "0.1.5"
          shellexpand = "3.1.1"
          [dev-dependencies]
          tempfile = "3"
          uuid = { version = "1", features = ["v4"] }
          TOML
          cd "$RUNNER_TEMP/rsync-path-tests"
          cargo test -- --nocapture 2>&1 | tee "$RUNNER_TEMP/rsync-path-test-logs/tests.log"
          cargo clippy --all-targets -- -D warnings 2>&1 | tee "$RUNNER_TEMP/rsync-path-test-logs/clippy.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rsync-test-logs-windows-${{ github.sha }}
          path: ${{ runner.temp }}/rsync-path-test-logs
          if-no-files-found: warn
          retention-days: 7
