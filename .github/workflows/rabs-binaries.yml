# S7 (bead bd-n8qt3): release builds of the three RABS spine binaries.
# The tiny wrapper (rabs-wrap) and the daemons (rabsd, rabs-wkr) must
# always build in release — the A021 split-profile discipline and the
# C010 overhead gate both assume the shipped artifact is release-built.
# This workflow proves they compile, and runs the doctor + wrapper
# overhead gates that only mean anything in release.
name: RABS Binaries

on:
  push:
    branches: [main]
    paths:
      - 'rabsd/**'
      - 'rabs-wrap/**'
      - 'rabs-wkr/**'
      - 'rabs-asupersync/**'
      - 'rabs-cas/**'
      - 'rabs-key/**'
      - 'rabs-sandbox/**'
      - 'rch-common/src/toolchain.rs'
      - 'rch-common/src/toolchain/**'
      - 'scripts/cargo-rabs'
      - 'scripts/test_rabs_live.py'
      - 'scripts/tests/test_rabs_live_runner.py'
      - 'scripts/tests/test_cargo_rabs.py'
      - 'scripts/tests/test_cargo_rabs_canonical.py'
      - 'scripts/tests/test_cargo_rabs_local.py'
      - 'scripts/tests/test_cargo_rabs_environment.py'
      - 'scripts/tests/test_cargo_rabs_job_controls.py'
      - 'scripts/install-rabs'
      - 'scripts/rabs-recover'
      - 'scripts/tests/test_rabs_recover.py'
      - 'scripts/tests/test_rabs_recover_canonical.py'
      - 'tests/test_install_rabs*.py'
      - 'tests/test_rabs_sprt_evidence.py'
      - 'tests/test_rabs_worker_cache.py'
      - 'tests/test_rabs_worker_cache_diagnostics.py'
      - 'tests/test_rabs_capture_recovery.py'
      - 'tests/test_rabs_evidence_queries.py'
      - '.github/workflows/release.yml'
      - '.github/workflows/rabs-binaries.yml'
  pull_request:
  workflow_dispatch:

concurrency:
  # Keep an explicitly requested source qualification alive when main advances.
  # Ordinary push/PR runs retain their existing replacement behavior.
  group: rabs-binaries-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_BUILD_JOBS: 2
  RCH_BUILD_SOURCE: ${{ github.sha }}

jobs:
  installation:
    name: complete RABS installation (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Native acceptance runner orchestration (explicit Cargo fixtures)
        run: python3 -I -S scripts/tests/test_rabs_live_runner.py -v
      - name: Native filesystem, process, archive and upgrade regressions
        run: python3 -m unittest discover -s tests -p 'test_install_rabs*.py' -v
      - name: SPRT native SQL and boundary model (not a Rust execution proof)
        run: python3 -m unittest discover -s tests -p test_rabs_sprt_evidence.py -v
      - name: Worker-local RABS bridge and managed launcher regressions
        run: |
          python3 scripts/tests/test_cargo_rabs.py -v
          python3 tests/test_rabs_worker_cache.py -v
          python3 tests/test_rabs_worker_cache_diagnostics.py -v
      - name: Canonical Cargo frontend (native driver is an explicit fixture)
        run: python3 -I -S scripts/tests/test_cargo_rabs_canonical.py -v
      - name: Selected local canonical builds, checks and tests (native driver is an explicit fixture)
        run: python3 -I -S scripts/tests/test_cargo_rabs_local.py -v
      - name: Explicit canonical build inputs (native driver is an explicit fixture)
        run: python3 -I -S scripts/tests/test_cargo_rabs_environment.py -v
      - name: Saved canonical job status and cancellation (native driver fixture)
        run: python3 -I -S scripts/tests/test_cargo_rabs_job_controls.py -v
      - name: Retained remote recovery (native driver, explicit daemon fixture)
        run: |
          python3 -I -S scripts/tests/test_rabs_recover.py -v
          python3 -I -S scripts/tests/test_rabs_recover_canonical.py -v
      - name: Capture recovery SQL and interruption model (not a Rust execution proof)
        run: python3 tests/test_rabs_capture_recovery.py -v
      - name: Indexed evidence queries (native SQLite, not Rust execution)
        run: python3 tests/test_rabs_evidence_queries.py -v

  # Exercise the accepted-hit delivery frontier independently of the slower
  # release/overhead lane. Local agent sandboxes may prohibit Unix sockets;
  # these tests must still run unchanged on a native runner.
  delivery-protocol:
    name: accepted-hit delivery protocol
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-08-31
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned test toolchain
        run: rustup toolchain install nightly-2026-08-31 --profile minimal --component rustfmt --component clippy
      - name: Native toolchain retention ownership without the daemon dependency graph
        run: |
          # The production owner now includes filesystem capture and lives in
          # the sandbox crate. Run all original ownership and new image tests.
          cargo test -p rabs-sandbox --lib toolchain_cache --locked
          cargo test -p rabs-sandbox --lib toolchain_cache --locked -- --test-threads=1
          cargo test -p rabs-sandbox --lib snapshot_capture --locked
          cargo test -p rabs-sandbox --lib source_transfer --locked
      - name: Check changed wrapper formatting
        run: rustfmt --edition 2024 --check rabs-wrap/src/main.rs rabs-wrap/tests/live_protocol.rs
      - name: Run wrapper unit and real socket delivery regressions
        run: cargo test -p rabs-wrap --bin rabs-wrap --test live_protocol --locked
      - name: Selected Cargo check and build planning with real compiler outputs
        run: |
          cargo test -p rabs-sandbox --lib cargo_check --locked
          cargo test -p rabs-sandbox --test cargo_check --locked -- --nocapture
          cargo clippy -p rabs-sandbox --lib --test cargo_check --locked -- -D warnings
      - name: Lint the tested wrapper targets
        run: cargo clippy -p rabs-wrap --bin rabs-wrap --test live_protocol --locked -- -D warnings

  build:
    name: release build + gates
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install bubblewrap (worker capability + sandbox tests)
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Workspace formatting, type checks and warnings before code generation
        env:
          CARGO_PROFILE_DEV_DEBUG: 0
          CARGO_PROFILE_TEST_DEBUG: 0
          CARGO_INCREMENTAL: 0
        run: |
          cargo fmt --check
          cargo check --locked --workspace --all-targets
          cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Release build the three spine binaries
        run: cargo build --locked --release -p rabsd -p rabs-wrap -p rabs-wkr
      - name: Worker-cache command assembly and opt-out parity
        run: cargo test --release -p rch-common --lib toolchain::worker_cache --locked
      - name: Coherent preparation to native worker-build handoff
        run: cargo test --release -p rabsd --bin rabsd worker_exec::prepared_build --locked
      - name: Shared prepared inputs and durable job ownership
        run: |
          cargo test --release -p rabsd --lib coord::prepared_operation --locked
          cargo test --release -p rabsd --test prepared_job_wait --test prepared_live_status --locked
      - name: Locked registry capture and isolated Cargo workspace
        run: |
          cargo test --release -p rabsd --lib coord::source_delivery::preparation::cargo --locked
          cargo test --release -p rabsd --lib coord::source_delivery::toolchain --locked
          cargo test --release -p rabsd --test cargo_vendor_prepare --locked
          cargo test --release -p rabs-sandbox --lib cargo_home --locked
          cargo test --release -p rabs-wkr --lib cargo_home --locked
      - name: Cargo workspace outputs and independent delivery verification
        run: |
          cargo test --release -p rabs-sandbox --lib canonical_namespace --locked
          cargo test --release -p rabs-sandbox --lib cargo_artifacts --locked
          cargo test --release -p rabs-sandbox --test cargo_artifacts --locked -- --nocapture
          cargo test --release -p rabs-wkr --lib cargo_capture --locked
          cargo test --release -p rabs-wkr --lib cargo_dynamic_outputs --locked
          cargo test --release -p rabsd --lib coord::worker_delivery::tests --locked
      - name: Private Cargo target reuse and concurrent seed lifetimes
        run: cargo test --release -p rabs-wkr --lib target_cache --locked
      - name: Binary size budget (rabs-wrap < 2 MiB, A021)
        run: |
          size=$(stat -c%s target/release/rabs-wrap)
          echo "rabs-wrap release size: $size bytes"
          test "$size" -lt 2097152
      - name: Worker diagnostic custody through real pipes and retained readers
        run: |
          cargo test --release -p rabs-asupersync --lib process_groups --locked
          cargo test --release -p rabs-asupersync --lib stream_drain --locked
          cargo test --release -p rabs-wkr --lib output::tests --locked
          cargo test --release -p rabs-wkr --lib session::tests --locked
          cargo test --release -p rabs-wkr --lib source_transfer --locked
          cargo test --release -p rabs-wkr --lib source_task --locked
          cargo test --release -p rabs-wkr --lib host_budget --locked
          cargo test --release -p rabs-wkr --lib root_admission --locked
      - name: Durable replay allowance and real compiler verification
        run: |
          cargo test --release -p rabs-cas --lib serving_sample_gate --locked
          cargo test --release -p rabs-cas --lib materialization::staged --locked
          cargo test --release -p rabs-cas --lib read_indexes --locked
          cargo test --release -p rabs-cas --lib trust_evidence --locked
          cargo test --release -p rabsd --test live_replay --test live_class_safety --test live_sprt_budget --locked
          cargo test --release -p rabsd --test publication_lineage --locked
          cargo test --release -p rabsd --lib edge::server --locked
          cargo test --release -p rabs-wrap --test live_dependency_e2e --locked
      - name: Shared endpoint ownership and restart fences
        run: cargo test --release -p rabs-sandbox --lib socket_endpoint --locked
      - name: Recurring CAS maintenance and physical reclaim
        run: |
          cargo test --release -p rabsd --lib janitor --locked
          cargo test --release -p rabsd --test janitor_gc_live --test janitor_reclaim_live --locked
      - name: Compiler capture custody and durable restart recovery
        run: |
          cargo test --release -p rabs-cas --lib blob_store --locked
          cargo test --release -p rabsd --lib output_capture --locked
          cargo test --release -p rabsd --lib capture_pins --locked
          cargo test --release -p rabsd --lib coord::live_dependency::remote::recovery --locked
          cargo test --release -p rabs-sandbox --lib toolchain_cache --locked
          cargo test --release -p rabsd --lib coord::live_dependency::remote::worker_pool_tests --locked
          cargo test --release -p rabsd --lib coord::live::tests::retry --locked
          cargo test --release -p rabsd --lib coord::action_actor::tests::retry_budget_and_illegal_transitions_refuse --locked
          cargo test --release -p rabsd --lib coord::live_dependency::remote::failover --locked
          cargo test --release -p rabsd --lib coord::live_dependency::remote::session_release_tests --locked
          cargo test --release -p rabsd --lib coord::live_dependency::remote::execution_resource_tests --locked
          cargo test --release -p rabsd --lib coord::live_dependency::shared_work --locked
          cargo test --release -p rabsd --lib coord::live_dependency::remote::shared --locked
          cargo test --release -p rabsd --lib coord::live_dependency::remote::request_owned_tests --locked
          cargo test --release -p rabsd --lib coord::remote_dependency_transport::tests --locked
          cargo test --release -p rabsd --lib edge::live_facts::package_capture --locked
      - name: Toolchain ownership and complete live input observations
        run: |
          cargo test --release -p rabs-key --lib live_dependency --locked
          cargo test --release -p rabsd --lib edge::live_facts --locked
          cargo test --release -p rabsd --test live_dependency_inventory --locked
      - name: Canonical local Cargo ownership and path projection
        run: |
          cargo test --release -p rabs-protocol --lib canonical_service --locked
          cargo test --release -p rabsd --lib coord::canonical_local --locked
          cargo test --release -p rabsd --lib coord::live_dependency::canonical --locked
          cargo test --release -p rabsd --test canonical_check_local --locked
      - name: Actual canonical Cargo earns and replays dependency results across worktrees
        timeout-minutes: 30
        env:
          RABS_CANONICAL_TEST_WRAPPER: ${{ github.workspace }}/target/release/rabs-wrap
        run: |
          cargo test --release -p rabsd --test canonical_check_local --locked \
            canonical_cargo_earns_cross_worktree_dependency_hits_and_invalidates_changed_source \
            -- --ignored --exact --nocapture
      - name: Canonical Cargo reuses private targets and rebuilds edited workspace units
        timeout-minutes: 30
        env:
          RABS_CANONICAL_TEST_WRAPPER: ${{ github.workspace }}/target/release/rabs-wrap
        run: |
          cargo test --release -p rabsd --test canonical_check_local --locked \
            canonical_private_targets_reuse_relocated_builds_and_preserve_current_outputs \
            -- --ignored --exact --nocapture
      - name: Canonical shared service overlaps Cargo roots and isolates cancellation
        timeout-minutes: 30
        env:
          RABS_CANONICAL_TEST_WRAPPER: ${{ github.workspace }}/target/release/rabs-wrap
          RABS_TEST_WORKER_BIN: ${{ github.workspace }}/target/release/rabs-wkr
        run: |
          cargo test --release -p rabsd --test canonical_check_local --locked \
            canonical_shared_service_overlaps_builds_scopes_cancellation_and_reuses_private_targets \
            -- --ignored --exact --nocapture
          cargo test --release -p rabsd --test canonical_check_local --locked \
            canonical_shared_remote_flight_survives_origin_cancellation \
            -- --ignored --exact --nocapture
          cargo test --release -p rabsd --test canonical_check_local --locked \
            canonical_shared_remote_queue_coalesces_and_survives_origin_cancellation \
            -- --ignored --exact --nocapture
          cargo test --release -p rabsd --test canonical_check_local --locked \
            canonical_shared_remote_failover_preserves_generation_and_surviving_subscriber \
            -- --ignored --exact --nocapture
      - name: Canonical Cargo delivers no-run tests and always executes current harnesses
        timeout-minutes: 30
        env:
          RABS_CANONICAL_TEST_WRAPPER: ${{ github.workspace }}/target/release/rabs-wrap
        run: |
          cargo test --release -p rabsd --test canonical_check_local --locked \
            canonical_cargo_tests_deliver_no_run_artifacts_and_execute_each_current_run \
            -- --ignored --exact --nocapture
      - name: Canonical Cargo executes current documentation tests with captured rustdoc
        timeout-minutes: 30
        env:
          RABS_CANONICAL_TEST_WRAPPER: ${{ github.workspace }}/target/release/rabs-wrap
        run: |
          cargo test --release -p rabsd --test canonical_check_local --locked \
            canonical_cargo_doctests_execute_with_captured_rustdoc_and_preserve_failures \
            -- --ignored --exact --nocapture
      - name: Canonical Cargo sends real metadata work over authenticated worker transport
        timeout-minutes: 30
        env:
          RABS_CANONICAL_TEST_WRAPPER: ${{ github.workspace }}/target/release/rabs-wrap
          RABS_TEST_WORKER_BIN: ${{ github.workspace }}/target/release/rabs-wkr
        run: |
          cargo test --release -p rabsd --test canonical_check_local --locked \
            canonical_cargo_offloads_real_dependency_samples_then_replays_across_worktrees \
            -- --ignored --exact --nocapture
      - name: Canonical Cargo offloads archives, replays them and delivers a working binary
        timeout-minutes: 30
        env:
          RABS_CANONICAL_TEST_WRAPPER: ${{ github.workspace }}/target/release/rabs-wrap
          RABS_TEST_WORKER_BIN: ${{ github.workspace }}/target/release/rabs-wkr
        run: |
          cargo test --release -p rabsd --test canonical_check_local --locked \
            canonical_cargo_build_offloads_archives_replays_and_delivers_a_working_binary \
            -- --ignored --exact --nocapture
      - name: Canonical Cargo captures generated metadata inputs and invalidates changed OUT_DIR
        timeout-minutes: 30
        env:
          RABS_CANONICAL_TEST_WRAPPER: ${{ github.workspace }}/target/release/rabs-wrap
          RABS_TEST_WORKER_BIN: ${{ github.workspace }}/target/release/rabs-wkr
        run: |
          cargo test --release -p rabsd --test canonical_check_local --locked \
            canonical_cargo_offloads_generated_metadata_replays_and_invalidates_changed_out_dir \
            -- --ignored --exact --nocapture
      - name: Canonical Cargo replays generated archives and delivers the changed linked result
        timeout-minutes: 30
        env:
          RABS_CANONICAL_TEST_WRAPPER: ${{ github.workspace }}/target/release/rabs-wrap
          RABS_TEST_WORKER_BIN: ${{ github.workspace }}/target/release/rabs-wkr
        run: |
          cargo test --release -p rabsd --test canonical_check_local --locked \
            canonical_cargo_build_offloads_generated_archives_and_delivers_changed_output \
            -- --ignored --exact --nocapture
      - name: Canonical generated leaf metadata invalidates its dependent
        timeout-minutes: 30
        env:
          RABS_CANONICAL_TEST_WRAPPER: ${{ github.workspace }}/target/release/rabs-wrap
          RABS_TEST_WORKER_BIN: ${{ github.workspace }}/target/release/rabs-wkr
        run: |
          cargo test --release -p rabsd --test canonical_check_local --locked \
            canonical_cargo_offloads_generated_dependency_metadata_and_invalidates_generated_bytes \
            -- --ignored --exact --nocapture
      - name: Canonical generated leaf archives deliver current transitive code
        timeout-minutes: 30
        env:
          RABS_CANONICAL_TEST_WRAPPER: ${{ github.workspace }}/target/release/rabs-wrap
          RABS_TEST_WORKER_BIN: ${{ github.workspace }}/target/release/rabs-wkr
        run: |
          cargo test --release -p rabsd --test canonical_check_local --locked \
            canonical_cargo_build_offloads_generated_archives_and_delivers_current_generated_code \
            -- --ignored --exact --nocapture
      - name: Canonical Cargo offloads propagated native roots and invalidates transitive consumers
        timeout-minutes: 45
        env:
          RABS_CANONICAL_TEST_WRAPPER: ${{ github.workspace }}/target/release/rabs-wrap
          RABS_TEST_WORKER_BIN: ${{ github.workspace }}/target/release/rabs-wkr
        run: |
          cargo test --release -p rabsd --test canonical_check_local --locked \
            canonical_cargo_build_offloads_propagated_native_archives_and_invalidates_transitive_consumers \
            -- --ignored --exact --nocapture
          cargo test --release -p rabsd --test canonical_check_local --locked \
            canonical_cargo_check_offloads_propagated_native_roots_and_invalidates_transitive_consumers \
            -- --ignored --exact --nocapture
          cargo test --release -p rabsd --test canonical_check_local --locked \
            canonical_cargo_build_bundles_generated_native_archives_replays_and_invalidates_them \
            -- --ignored --exact --nocapture
          cargo test --release -p rabsd --test canonical_check_local --locked \
            canonical_cargo_check_offloads_native_dependency_metadata_replays_and_invalidates_archives \
            -- --ignored --exact --nocapture
      - name: Closed archive isolation and authenticated mode selection
        run: |
          cargo test --release -p rabs-sandbox --lib dependency_context --locked
          RABS_TEST_TOOLCHAIN_ROOT="$(rustc --print sysroot)" \
            cargo test --release -p rabs-sandbox --lib \
              real_rustc_archive_view_closes_assembler_inputs_missing_from_dep_info \
              --locked -- --ignored --nocapture
          RABS_TEST_TOOLCHAIN_ROOT="$(rustc --print sysroot)" \
            cargo test --release -p rabs-sandbox --lib \
              dependency_context::tests::real_canonical_rustc_archive_view_closes_assembler_inputs_missing_from_dep_info \
              --locked -- --ignored --exact --nocapture
          RABS_TEST_TOOLCHAIN_ROOT="$(rustc --print sysroot)" \
            cargo test --release -p rabs-sandbox --lib \
              real_canonical_archive_bundles_ \
              --locked -- --ignored --nocapture
          cargo test --release -p rabs-wkr --bin rabs-wkr dependency --locked
          cargo test --release -p rabs-wkr --bin rabs-wkr archive --locked
          cargo test --release -p rabs-wkr --lib canonical_generated_inputs --locked
          cargo test --release -p rabsd --lib coord::secure_worker_delivery::tests --locked
          cargo test --release -p rabs-wkr --test process_tree_linux \
            real_dependency_rustc_builds_archive_with_generated_inputs_and_shared_dag \
            --locked -- --nocapture
          cargo test --release -p rabs-wkr --test process_tree_linux \
            real_canonical_dependency_rustc_builds_archive_with_shared_dag_and_assembly_input \
            --locked -- --exact --nocapture
          cargo test --release -p rabs-wkr --test process_tree_linux \
            real_canonical_dependency_rustc_reads_generated_out_dir_with_shared_metadata_dag \
            --locked -- --exact --nocapture
          cargo test --release -p rabs-wkr --test process_tree_linux \
            real_canonical_dependency_rustc_builds_archive_with_generated_inputs_and_shared_dag \
            --locked -- --exact --nocapture
      - name: Actual offline Cargo builds, links and replays remote archives
        timeout-minutes: 30
        env:
          RABS_TEST_WORKER_BIN: ${{ github.workspace }}/target/release/rabs-wkr
          RABS_TEST_WRAP_BIN: ${{ github.workspace }}/target/release/rabs-wrap
        run: |
          cargo test --release -p rabsd --test prepared_operation_live \
            actual_offline_cargo_build_uses_remote_archives_then_links_and_replays \
            --locked -- --ignored --nocapture
      - name: Actual canonical Cargo run and bench with persistent warm targets
        timeout-minutes: 30
        env:
          RABS_TEST_WORKER_BIN: ${{ github.workspace }}/target/release/rabs-wkr
        run: |
          cargo test --release -p rabsd --test prepared_operation_live \
            actual_canonical_cargo_ --locked -- --ignored --nocapture
      - name: Cargo layout projection keys and real split-directory builds
        run: |
          cargo test --release -p rabsd cargo_placement_reuse --locked
          cargo test --release -p rabs-wrap --test live_cargo_layout --locked -- --nocapture
      - name: Real Cargo worktrees receive served dependencies (M4)
        run: cargo test --release -p rabs-wrap --test live_cargo_worktrees --locked -- --nocapture
      - name: Stock differential release gate and durable verdict authorization (T011 / bd-dockb)
        run: |
          cargo test --release -p rabs-protocol --lib release_authorization --locked
          cargo test --release -p rabs-replay --lib release_gate --locked
          cargo test --release -p rabsd --test coord_commit_live the_release_gate_governs_serving_promotion_for_the_whole_build --locked
      - name: Doctor + wrapper overhead gate (release, enforcing)
        run: |
          cargo test --release -p rabsd --test doctor_live
          cargo test --release -p rabs-wrap --test overhead_live -- --nocapture
