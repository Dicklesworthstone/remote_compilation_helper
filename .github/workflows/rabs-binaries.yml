# S7 (bead bd-n8qt3): release builds of the three RABS spine binaries.
# The tiny wrapper (rabs-wrap) and the daemons (rabsd, rabs-wkr) must
# always build in release — the A021 split-profile discipline and the
# C010 overhead gate both assume the shipped artifact is release-built.
# This workflow proves they compile, and runs the doctor + wrapper
# overhead gates that only mean anything in release.
name: RABS Binaries

on:
  push:
    branches: [main]
    paths:
      - 'rabsd/**'
      - 'rabs-wrap/**'
      - 'rabs-wkr/**'
      - 'rabs-asupersync/**'
      - '.github/workflows/rabs-binaries.yml'
  pull_request:
  workflow_dispatch:

concurrency:
  group: rabs-binaries-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Exercise the accepted-hit delivery frontier independently of the slower
  # release/overhead lane. Local agent sandboxes may prohibit Unix sockets;
  # these tests must still run unchanged on a native runner.
  delivery-protocol:
    name: accepted-hit delivery protocol
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-08-31
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned test toolchain
        run: rustup toolchain install nightly-2026-08-31 --profile minimal --component rustfmt --component clippy
      - name: Check changed wrapper formatting
        run: rustfmt --edition 2024 --check rabs-wrap/src/main.rs rabs-wrap/tests/live_protocol.rs
      - name: Run wrapper unit and real socket delivery regressions
        run: cargo test -p rabs-wrap --bin rabs-wrap --test live_protocol --locked
      - name: Lint the tested wrapper targets
        run: cargo clippy -p rabs-wrap --bin rabs-wrap --test live_protocol --locked -- -D warnings

  build:
    name: release build + gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bubblewrap (worker capability + sandbox tests)
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Release build the three spine binaries
        run: cargo build --release -p rabsd -p rabs-wrap -p rabs-wkr
      - name: Binary size budget (rabs-wrap < 2 MiB, A021)
        run: |
          size=$(stat -c%s target/release/rabs-wrap)
          echo "rabs-wrap release size: $size bytes"
          test "$size" -lt 2097152
      - name: Durable replay allowance and real compiler verification
        run: |
          cargo test --release -p rabsd --test live_replay --locked
          cargo test --release -p rabs-wrap --test live_dependency_e2e --locked
      - name: Real Cargo worktrees receive served dependencies (M4)
        run: cargo test --release -p rabs-wrap --test live_cargo_worktrees --locked -- --nocapture
      - name: Doctor + wrapper overhead gate (release, enforcing)
        run: |
          cargo test --release -p rabsd --test doctor_live
          cargo test --release -p rabs-wrap --test overhead_live -- --nocapture
