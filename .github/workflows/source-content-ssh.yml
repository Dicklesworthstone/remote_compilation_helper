name: Source-content SSH integrity

on:
  push:
    branches: [main]
    paths:
      - 'rch/src/transfer.rs'
      - 'rch/src/hook/ssh.rs'
      - 'rch/src/transfer/source_content_barrier.rs'
      - 'scripts/test_source_content_ssh.py'
      - '.github/workflows/source-content-ssh.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  RECEIPT_PATCH: 373b8c9691c8128c8ef8c35da7ac93421cdc4fcf

jobs:
  prepare-reviewed-files:
    if: >-
      github.event_name == 'push' && contains(github.event.head_commit.message, '[source84-prepare]')
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # This is source preparation, NOT qualification or branch publication.
      # It emits the exact reviewed changes before the independent native job.
      - name: Apply the reviewed patch to exact current source blobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, shutil, subprocess, urllib.request
          expected = {
              'rch/src/transfer.rs': 'c3f6bb73bdc9655bb84a3428866cb310f3fa6b06',
              'rch/src/hook/ssh.rs': 'ec59e1e6ba5fc24e48ddf199a34feb8b09ae5063',
              'rabs-scheduler/src/managed_pool.rs': 'c91e4b77b877c6ef32b68583aabffa61f90ae2c3',
              'rch/src/transfer/source_content_barrier.rs': 'd7db94dcc5dcd6fea5578f605514433fccf78a7c',
          }
          def git_hash(path):
              return subprocess.check_output(['git', 'hash-object', path], text=True).strip()
          for path, sha in expected.items():
              actual = git_hash(path)
              if actual != sha:
                  raise RuntimeError(f'{path}: expected {sha}, found {actual}; rebase required')
          def api(suffix, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/{suffix}",
                  data=data, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                      'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          sha = os.environ['RECEIPT_PATCH']
          patch_bytes = base64.b64decode(api(f'git/blobs/{sha}')['content'])
          actual = hashlib.sha1(b'blob ' + str(len(patch_bytes)).encode() + b'\0' + patch_bytes).hexdigest()
          if actual != sha:
              raise RuntimeError('reviewed patch digest mismatch')
          evidence = pathlib.Path(os.environ['RUNNER_TEMP']) / 'source84-preparation'
          evidence.mkdir()
          patch = evidence / 'reviewed.patch'
          patch.write_bytes(patch_bytes)
          subprocess.run(['git', 'apply', '--check', '--whitespace=error-all', str(patch)], check=True)
          subprocess.run(['git', 'apply', '--whitespace=error-all', str(patch)], check=True)
          subprocess.run(['git', 'diff', '--check'], check=True)
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          if set(changed) != set(expected) - {'rch/src/transfer/source_content_barrier.rs'}:
              raise RuntimeError(f'unexpected changed files: {changed}')
          if git_hash('rch/src/transfer/source_content_barrier.rs') != expected['rch/src/transfer/source_content_barrier.rs']:
              raise RuntimeError('qualified policy was changed')
          entries = []
          for path in changed:
              data = pathlib.Path(path).read_bytes()
              blob = api('git/blobs', {'encoding': 'base64', 'content': base64.b64encode(data).decode()})
              if blob['sha'] != git_hash(path):
                  raise RuntimeError(f'uploaded source digest mismatch: {path}')
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
              target = evidence / path
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(path, target)
          report = {'base_sha': os.environ['GITHUB_SHA'], 'expected_blobs': expected,
                    'files': entries, 'validation': 'patch application and whitespace only; see independent native job'}
          (evidence / 'prepared.json').write_text(json.dumps(report, indent=2) + '\n')
          (evidence / 'prepared.patch').write_bytes(subprocess.check_output(['git', 'diff', '--binary']))
          print(json.dumps(report, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-content-prepared-${{ github.sha }}
          path: ${{ runner.temp }}/source84-preparation
          retention-days: 7
  ssh-integrity:
    needs: prepare-reviewed-files
    if: >-
      always() && (needs.prepare-reviewed-files.result == 'success' || needs.prepare-reviewed-files.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: stable
      RSYNC_OLD_ARGS: '0'
      RSYNC_PROTECT_ARGS: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download the prepared integration
        if: needs.prepare-reviewed-files.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: source-content-prepared-${{ github.sha }}
          path: ${{ runner.temp }}/source84-preparation
      - name: Apply the prepared integration for qualification
        if: needs.prepare-reviewed-files.result == 'success'
        run: |
          set -euo pipefail
          git apply --check --whitespace=error-all "$RUNNER_TEMP/source84-preparation/prepared.patch"
          git apply --whitespace=error-all "$RUNNER_TEMP/source84-preparation/prepared.patch"
      - name: Install native regression tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y rsync openssh-client openssh-server
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Check receipt transport formatting
        run: |
          set -euo pipefail
          rustfmt --check --edition 2024 --config skip_children=true rch/src/transfer.rs rch/src/hook/ssh.rs rch/src/transfer/source_content_barrier.rs rabs-scheduler/src/managed_pool.rs
          git diff --check
      - name: Test exact Rust policy with real SSH and rsync
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source84-evidence"
          python3 scripts/test_source_content_ssh.py --evidence "$RUNNER_TEMP/source84-evidence" 2>&1 | tee "$RUNNER_TEMP/source84-evidence/run.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-content-ssh-${{ github.sha }}
          path: ${{ runner.temp }}/source84-evidence
          if-no-files-found: warn
          retention-days: 7
