name: Source-content SSH integrity

on:
  push:
    branches: [main]
    paths:
      - 'rch/src/transfer.rs'
      - 'rch/src/transfer/source_content_barrier.rs'
      - 'scripts/test_source_content_ssh.py'
      - '.github/workflows/source-content-ssh.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ssh-integrity:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    # Initial preparation stores reviewed source blobs only. Branch publication
    # remains an explicit, lease-checked GitHub operation, never a CI side effect.
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: stable
      RSYNC_OLD_ARGS: '0'
      RSYNC_PROTECT_ARGS: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare the exact reviewed transport integration
        if: >-
          github.event_name == 'push' && contains(github.event.head_commit.message, '[source84-prepare]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          path = 'rch/src/transfer.rs'
          expected = 'c8f7e6351e78a6db695e89e7987e1aa6eddf645b'
          actual = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
          assert actual == expected, (path, actual, expected)
          sha = '8a376bf0914efa8985e1469fa54f35c4f8fe571e'
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs/{sha}"
          request = urllib.request.Request(url, headers={
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
          })
          with urllib.request.urlopen(request, timeout=30) as response:
              blob = json.load(response)
          patch_bytes = base64.b64decode(blob['content'])
          assert hashlib.sha1(b'blob ' + str(len(patch_bytes)).encode() + b'\0' + patch_bytes).hexdigest() == sha
          patch = pathlib.Path(os.environ['RUNNER_TEMP']) / 'source84.patch'
          patch.write_bytes(patch_bytes)
          subprocess.run(['git', 'apply', '--check', str(patch)], check=True)
          subprocess.run(['git', 'apply', str(patch)], check=True)
          PY
      - name: Install native regression tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y rsync openssh-client openssh-server
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Parse and format the receipt transport integration
        run: |
          set -euo pipefail
          rustfmt --edition 2024 --config skip_children=true rch/src/transfer.rs rch/src/transfer/source_content_barrier.rs
          git diff --check
      - name: Test exact Rust policy with real SSH and rsync
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source84-evidence"
          python3 scripts/test_source_content_ssh.py --evidence "$RUNNER_TEMP/source84-evidence" 2>&1 | tee "$RUNNER_TEMP/source84-evidence/run.log"
      - name: Stage tested source blobs without updating any branch
        if: >-
          github.event_name == 'push' && contains(github.event.head_commit.message, '[source84-prepare]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, pathlib, shutil, subprocess, urllib.request
          paths = ['rch/src/transfer.rs', 'rch/src/transfer/source_content_barrier.rs']
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          assert set(changed) <= set(paths), changed
          evidence = pathlib.Path(os.environ['RUNNER_TEMP']) / 'source84-evidence'
          entries = []
          for path in paths:
              data = pathlib.Path(path).read_bytes()
              payload = json.dumps({'encoding': 'base64', 'content': base64.b64encode(data).decode()}).encode()
              url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs"
              request = urllib.request.Request(url, data=payload, method='POST', headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json',
              })
              with urllib.request.urlopen(request, timeout=60) as response:
                  blob = json.load(response)
              assert blob['sha'] == subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
              target = evidence / path
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(path, target)
          report = {'base_sha': os.environ['GITHUB_SHA'], 'files': entries,
                    'validation': 'exact Rust policy and real OpenSSH/rsync fixture passed; not a full-workspace compile'}
          (evidence / 'prepared.json').write_text(json.dumps(report, indent=2) + '\n')
          (evidence / 'prepared.patch').write_bytes(subprocess.check_output(['git', 'diff', '--binary']))
          print(json.dumps(report, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-content-ssh-${{ github.sha }}
          path: ${{ runner.temp }}/source84-evidence
          if-no-files-found: warn
          retention-days: 7
