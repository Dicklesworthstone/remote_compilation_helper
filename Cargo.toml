[workspace]
resolver = "3"
members = [
    "rch",
    "rchd",
    "rch-wkr",
    "rch-common",
    "rch-telemetry",
    # RABS (Asupersync-native Accelerated Build Sidecar) crates — see the
    # RABS bead graph (remote_compilation_helper-rabs-root-4pidu) and
    # COMPREHENSIVE_MASTER_PLAN_FOR_RABS_ASUPERSYNC_NATIVE.md.
    # Dependency rules per crate are stated in each crate's lib.rs doc
    # header and enforced by dependency-direction CI (bead A002).
    "rabs-protocol",
    "rabs-action",
    "rabs-key",
    "rabs-cas",
    "rabs-sandbox",
    "rabs-wrap",
    "rabs-scheduler",
    "rabs-replay",
    "rabs-asupersync",
    "rabsd",
    "rabs-wkr",
]

[workspace.package]
version = "1.0.60"
edition = "2024"
license = "LicenseRef-MIT-OpenAI-Anthropic-Rider"
authors = ["Remote Compilation Helper Contributors"]
repository = "https://github.com/Dicklesworthstone/remote_compilation_helper"
homepage = "https://github.com/Dicklesworthstone/remote_compilation_helper"
documentation = "https://docs.rs/rch-common"
readme = "README.md"
keywords = ["compilation", "remote", "build", "ai", "agent"]
categories = ["development-tools", "command-line-utilities"]

[workspace.dependencies]
# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toon-rust = { package = "tru", version = "0.2.3" }
schemars = "0.8"

# Async runtime
tokio = { version = "1.49.0", features = ["full"] }

# CLI
clap = { version = "4.5.60", features = ["derive", "env"] }
clap_complete = { version = "4.5.66", features = ["unstable-dynamic"] }

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }
tracing-appender = "0.2.4"

# String search (SIMD-accelerated)
memchr = "2.8.0"

# Unicode text handling
unicode-width = "0.2.2"

# Regex for pattern matching
regex = "1.12.3"

# Fast hashing
blake3 = "1.8.3"
# SHA-256 for RABS typed authoritative digests (bead F034; pure, no-default
# features; reviewed addition to the rabs-key pure-crate allowlist)
sha2 = { version = "0.10", default-features = false }

# Binary/object file parsing (ELF, Mach-O, etc.)
object = { version = "0.38.1", default-features = false, features = ["read", "elf", "macho"] }

# UUID generation
uuid = { version = "1.21.0", features = ["v4", "serde"] }

# Random number generation
rand = "0.10.1"

# Compression
zstd = "0.13.3"
flate2 = "1.1.9"
tar = { version = "0.4.45", default-features = false }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }

# Time formatting for mock transport logging
chrono = { version = "0.4.43", features = ["serde"] }

# Human-friendly duration parsing
humantime = "2.3.0"

# Cron-style scheduling for daemon tasks
tokio-cron-scheduler = "0.15.1"
cron = "0.15"

# SSH
openssh = "0.11.6"

# Configuration
toml = "1.0"
directories = "6.0"
dirs = "6.0"

# File watching (for hot-reload)
notify = "8.2"

# Filesystem timestamp setting (K004 freshness policy: coherent mtime
# stamping of materialized cache hits; safe wrapper over utimensat)
filetime = "0.2"

# Metrics and Observability
prometheus = "0.14"
lazy_static = "1.5"

# OpenTelemetry
opentelemetry = "0.31.0"
opentelemetry_sdk = { version = "0.31.0", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.31.0", features = ["tonic"] }
tracing-opentelemetry = "0.32"

# HTTP server for metrics endpoint
axum = { version = "0.8.8", features = ["http1"] }
tower = "0.5"
hyper = { version = "1.8.1", features = ["full"] }

# HTTP client for webhook dispatch
ureq = "3.2"

# Error handling
thiserror = "2.0.18"
anyhow = "1.0.101"
miette = { version = "7.6.0", features = ["fancy"] }

# Interactive CLI prompts
dialoguer = { version = "0.12", features = ["fuzzy-select"] }
console = "0.16.2"

# Markdown rendering
pulldown-cmark = "0.13"

# TUI (Terminal User Interface) — FrankenTUI native stack (published on crates.io)
ftui = { version = "0.4", default-features = false, features = ["runtime"] }
ftui-core = { version = "0.4" }
ftui-render = { version = "0.4" }
ftui-style = { version = "0.4" }
ftui-text = { version = "0.4" }
ftui-layout = { version = "0.4" }
ftui-widgets = { version = "0.4" }
ftui-tty = { version = "0.4" }
ftui-backend = { version = "0.4" }

# Rich terminal output (optional, for enhanced UI; published on crates.io)
rich_rust = { version = "0.2" }

# Internal crates
# Use default-features = false for cross-platform compatibility (rich-ui uses Unix-only rich_rust)
# Crates that need rich-ui should explicitly enable it via features = ["rich-ui"]
rch-common = { path = "rch-common", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# A021 — tiny-wrapper profile (rch hook CLI, rabs-wrap): startup
# latency + footprint first. panic=unwind is NON-NEGOTIABLE here
# (I49 containment: no guard process wraps these, so an abort would
# take the shell down with it); LTO is deliberately ABSENT until the
# profile_benchmark.sh startup evidence justifies enabling it. LTO
# revisit (bd-7f81c): fat-LTO proxy on rabs-wrap showed -15.6% size
# with no detectable CPU-time penalty, but the decisive rch-specific
# sample was blocked by a broken main; see benchmarks/baselines/
# profile_split_lto_revisit.ndjson ("rabs.lto-revisit" record) for the
# one-command re-check before flipping lto on.
[profile.wrapper-release]
inherits = "release"
opt-level = "z"
strip = true
panic = "unwind"
codegen-units = 1
lto = false

# A021 — daemon/worker profile (rchd, rabsd, rch-wkr, rabs-wkr):
# sustained throughput over footprint. Symbols are RETAINED
# (strip=false) so crashpacks stay debuggable per release policy; LTO
# is thin as the measured default until full-trace benchmarks argue
# otherwise; no abort (a daemon panic unwinds and is contained).
[profile.daemon-release]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = false

