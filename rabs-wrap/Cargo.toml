[package]
name = "rabs-wrap"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "RABS tiny RUSTC_WRAPPER binary: breaker-gated daemon consult, exec passthrough (bridge plan S2)"
publish = false

# Tiny-wrapper profile discipline (A021): the workspace release profile
# is already opt-level=z + LTO + panic=abort + strip. Dependency budget
# is deliberately minimal — protocol + safe executable lookup; no async runtime, no
# serde (hand-rolled frames): the p95 <10ms budget is the design.
[dependencies]
rabs-protocol = { path = "../rabs-protocol" }

[target.'cfg(unix)'.dependencies]
# Match execvp's effective-user executable search without unsafe code or a
# helper process. Mode-bit guesses can select a compiler the caller cannot run.
rustix = { version = "1.1.4", features = ["fs"] }
# Kernel threads can have PGID 0. Rustix's Pid-returning getpgid cannot represent
# that valid value; nix preserves it without unsafe code here. All visible PIDs
# are still enumerated and matching members receive both full terminal sweeps.
nix = { version = "0.31.3", default-features = false, features = ["process"] }

[dev-dependencies]
tempfile = "3.25.0"
serde_json = { workspace = true }
sha2 = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
