[package]
name = "rabs-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "Native canonical Cargo and retained-result operator commands"
publish = false

[[bin]]
name = "rabs-recover"
path = "src/main.rs"

[[bin]]
name = "rabs-cargo"
path = "src/cargo_main.rs"

[[bin]]
name = "cargo-rabs"
path = "src/cargo_subcommand.rs"

[[bin]]
name = "rabs-install"
path = "src/install_main.rs"
required-features = ["installer"]

[features]
installer = ["dep:flate2", "dep:tar"]

# Operator-only dependency cone. Selection uses shared sandbox validators;
# execution and authenticated transport remain in the separate native driver.
[dependencies]
rabs-protocol = { path = "../rabs-protocol" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
flate2 = { workspace = true, optional = true }
tar = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
rabs-sandbox = { path = "../rabs-sandbox" }
rustix = { version = "1.1.5", features = ["fs", "process"] }
tempfile = "3.25.0"

[dev-dependencies]
tempfile = "3.25.0"

[lints.rust]
unsafe_code = "forbid"
