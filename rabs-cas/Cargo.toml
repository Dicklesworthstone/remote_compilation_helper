[package]
name = "rabs-cas"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Durable RABS content-addressed storage, action-cache indexing, object lifecycle, and publication transactions"
publish = false

[lib]
doctest = false

[features]
# Public offer / ready-store builders for downstream LIVE commit tests
# (bd-g900u). Off by default; never in a normal build. rabsd enables it as
# a dev-dependency feature only.
test-support = []

# Core storage semantics stay Tokio-free and Asupersync-free; filesystem
# effects are permitted here (this crate OWNS durable storage). The metadata
# store abstraction gains a reference-SQLite backend and a gated FrankenSQLite
# backend in Epic H. Dependency-direction CI (bead A002) forbids Tokio and
# rabs-asupersync from the core.
[dependencies]
rabs-protocol = { path = "../rabs-protocol" }
# H009 metadata-store backends: rusqlite (bundled C SQLite) is the
# reference/differential TRUTH engine; fsqlite (FrankenSQLite, pure Rust)
# is the dogfood candidate gated by the identical suite (H024).
rusqlite = { version = "0.39.0", features = ["bundled"] }
fsqlite = { version = "0.1.19", default-features = false, features = ["native"] }
# Reviewed pure digest crate (F034 pattern): independent recompute of
# result-projection digests during publication admission (H011).
sha2 = { workspace = true }
# Reviewed pure digest crate: fast LOCAL fingerprints only (H002) —
# structurally kept out of TypedDigest so a BLAKE3 value can never enter
# authoritative metadata as an identity digest.
blake3 = { workspace = true }
# H039: publication admission reuses F035's ONE bundle-root/derived-index
# implementation instead of duplicating the canonical framing here (two
# implementations of the root computation could silently drift). Pure
# sibling crate; depends only on rabs-protocol.
rabs-key = { path = "../rabs-key" }
# K004: coherent freshness stamping of materialized outputs (plan §30 —
# outputs newer than inputs, private materializations only).
filetime = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
