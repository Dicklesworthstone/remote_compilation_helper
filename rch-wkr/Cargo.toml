[package]
name = "rch-wkr"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Remote Compilation Helper - Worker agent for remote execution"

[[bin]]
name = "rch-wkr"
path = "src/main.rs"

[dependencies]
rch-common = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = "0.10.0"
tokio = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
blake3 = { workspace = true }
sha2 = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
schemars = { workspace = true }
tempfile = "3.25.0"
rch-telemetry = { path = "../rch-telemetry", version = "2.1.0", default-features = false }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["fs", "process", "event", "time", "pipe", "stdio"] }
nix = { version = "0.31.3", features = ["signal", "process", "time"] }
signal-hook = "0.4.4"

[lints.rust]
unsafe_code = "forbid"
