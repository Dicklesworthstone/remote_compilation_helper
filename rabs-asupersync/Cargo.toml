[package]
name = "rabs-asupersync"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "The ONLY broad adapter between RABS domain types and Asupersync/ATP implementation types"
publish = false

[lib]
doctest = false

# Exact revision pin per docs/adr/007-asupersync-revision-pin.md (bead A003):
# the plan-reviewed commit; advances ONLY via the ADR's upgrade procedure
# (A010 report + A009 contract suite). This crate is the sole place
# Asupersync types may appear; no durable or public RABS schema may contain
# a type from this crate (invariant I14, boundary tests in bead A008).
[dependencies]
# Minimal rabs-profile (bead A004, plan sec 42): default features minus the
# experimental nightly-outcome-try Try/residual impls — RABS uses explicit
# Outcome helpers, not experimental trait impls. Browser/wasm, legacy
# harness, and real-service-e2e features stay OFF (enforced by
# tests/feature_profile.rs); test-internals may appear ONLY under
# [dev-dependencies] for lab tests.
asupersync = { git = "https://github.com/Dicklesworthstone/asupersync.git", rev = "62d398ea17519d7e80cbdb32e062d70647cd58a4", default-features = false, features = ["proc-macros"] }
rabs-protocol = { path = "../rabs-protocol" }

[lints.rust]
unsafe_code = "forbid"
