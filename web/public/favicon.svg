<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="rch-grad" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="rch-glow" x1="16" y1="12" x2="48" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded hexagon / squircle -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="#090d16" stroke="url(#rch-grad)" stroke-width="2.5" />

  <!-- Compute Core / Slot Matrix Grid Background -->
  <g opacity="0.35">
    <rect x="14" y="14" width="8" height="8" rx="2" fill="#38bdf8" />
    <rect x="26" y="14" width="8" height="8" rx="2" fill="#38bdf8" />
    <rect x="38" y="14" width="8" height="8" rx="2" fill="#38bdf8" />
    <rect x="14" y="26" width="8" height="8" rx="2" fill="#38bdf8" />
    <rect x="26" y="26" width="8" height="8" rx="2" fill="#38bdf8" />
    <rect x="38" y="26" width="8" height="8" rx="2" fill="#38bdf8" />
    <rect x="14" y="38" width="8" height="8" rx="2" fill="#38bdf8" />
    <rect x="26" y="38" width="8" height="8" rx="2" fill="#38bdf8" />
    <rect x="38" y="38" width="8" height="8" rx="2" fill="#38bdf8" />
  </g>

  <!-- Active Glowing Slot Cells -->
  <rect x="14" y="14" width="8" height="8" rx="2" fill="#00f0ff" opacity="0.9" filter="url(#glow)" />
  <rect x="38" y="14" width="8" height="8" rx="2" fill="#3b82f6" opacity="0.8" />
  <rect x="14" y="38" width="8" height="8" rx="2" fill="#38bdf8" opacity="0.85" />
  <rect x="38" y="38" width="8" height="8" rx="2" fill="#00f0ff" opacity="0.9" filter="url(#glow)" />

  <!-- High-Energy Lightning Bolt Symbol -->
  <path d="M35 10 L19 32 L30 32 L26 54 L44 28 L33 28 Z" fill="url(#rch-glow)" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round" filter="url(#glow)" />
</svg>
