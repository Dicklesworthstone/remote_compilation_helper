[package]
name = "rabsd"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "RABS edge + coordinator daemon (combined deployment; roles, authority, and durable state remain explicitly split)"
publish = false

[lib]
doctest = false

# Daemon crate: composes the domain crates and (via rabs-asupersync) the
# runtime. The edge/coord role split is structural (src/edge.rs, src/coord.rs)
# even while both ship in one binary — invariant: authority, durable state,
# and protocol interfaces stay distinct from day one.
[dependencies]
rabs-protocol = { path = "../rabs-protocol" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }
rabs-action = { path = "../rabs-action" }
rabs-key = { path = "../rabs-key" }
rabs-cas = { path = "../rabs-cas" }
rabs-sandbox = { path = "../rabs-sandbox" }
rabs-scheduler = { path = "../rabs-scheduler" }
rabs-asupersync = { path = "../rabs-asupersync" }
# Direct runtime dependency (imports moved off the adapter re-export to
# satisfy the I14 boundary test; pin matches rabs-asupersync's A003 rule).
asupersync = { git = "https://github.com/Dicklesworthstone/asupersync.git", rev = "107adf1df8d274b37c6ed9a12471fe3da44429f2", default-features = false, features = ["proc-macros"] }

[dev-dependencies]
tempfile = "3.25.0"
# bd-g900u: the public offer / ready-store builders, so the live commit
# tests (bd-epyez) can drive the real publication engine from out here.
rabs-cas = { path = "../rabs-cas", features = ["test-support"] }
# G003: the actor-shell smoke test constructs `Cx::for_testing()`, which
# asupersync gates behind `test-internals` (br-asupersync-2x6hbi) so
# production code cannot mint an all-caps context out of band. Dev-graph
# only; the pin matches rabs-asupersync's exact-revision rule (bead A003).
asupersync = { git = "https://github.com/Dicklesworthstone/asupersync.git", rev = "107adf1df8d274b37c6ed9a12471fe3da44429f2", default-features = false, features = ["proc-macros", "test-internals"] }

[lints.rust]
unsafe_code = "forbid"
