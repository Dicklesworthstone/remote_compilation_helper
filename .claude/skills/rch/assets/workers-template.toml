# RCH Workers Configuration Template
# Copy to: ~/.config/rch/workers.toml
#
# Each [[workers]] block defines a remote machine for compilation offloading.
# RCH selects workers based on available slots, priority, and project locality.

# Example: Primary fast build server
[[workers]]
id = "primary"                           # Unique identifier
host = "192.168.1.100"                   # IP or hostname
user = "ubuntu"                          # SSH username
identity_file = "~/.ssh/id_ed25519"      # Path to SSH private key
total_slots = 16                         # Max concurrent jobs (usually CPU cores)
priority = 100                           # Higher = preferred (default: 50)
tags = ["rust", "bun", "fast"]           # Descriptive labels only (see Tips)
# os = "linux"                           # Hard gate — omit unless cross-platform
# enabled = true                         # Set to false to disable temporarily

# Example: Secondary backup server (lower priority)
# [[workers]]
# id = "backup"
# host = "build-backup.local"
# user = "build"
# identity_file = "~/.ssh/build_key"
# total_slots = 8
# priority = 50
# tags = ["rust"]

# Example: Specialized TypeScript worker
# [[workers]]
# id = "typescript-builder"
# host = "ts.internal"
# user = "node"
# identity_file = "~/.ssh/ts_key"
# total_slots = 12
# priority = 75
# tags = ["bun", "typescript"]

# Example: Windows worker for MSVC targets
# `os` is a HARD admission gate and makes the worker EXCLUSIVE: it only receives
# commands that require that OS (e.g. --target x86_64-pc-windows-msvc). An
# ordinary `cargo check` is never scheduled here. Omit `os` for a normal worker.
#
# NOTE: an rchd older than the OS-gate release silently IGNORES this key and
# leaves the worker unfenced. Upgrade the daemon before adding the worker.
# [[workers]]
# id = "windows-builder"
# host = "192.168.1.127"
# user = "builder"
# identity_file = "~/.ssh/windows_key"
# total_slots = 4
# priority = 60
# os = "windows"
# tags = ["rust"]

# Tips:
# - total_slots: Match to CPU cores. Leave 1-2 for system overhead.
# - priority: Range 1-100. Equal slots? Higher priority wins.
# - tags: DESCRIPTIVE ONLY. Nothing in rch matches on them; they do not gate
#         scheduling. Runtime capability (rust/go/bun) is probed, not tagged.
# - os:   The one hard gate. Only set it on a genuinely cross-platform worker.
# - identity_file: Use ssh-agent for passphrase-protected keys
#
# Test your configuration:
#   rch config validate
#   rch workers probe --all
