[package]
name = "rabs-key"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Canonical RABS action-key construction, discovery recipes, presentation variants, and key explainability"
publish = false

[lib]
doctest = false

# rabs-protocol is the ONLY permitted dependency (hashing enters later via an
# explicitly reviewed pure digest crate). No Tokio, no Asupersync, no
# network/filesystem/process crates. Dependency-direction CI (bead A002)
# enforces this.
[dependencies]
rabs-protocol = { path = "../rabs-protocol" }
# The reviewed pure digest crate (bead F034): SHA-256 for typed
# authoritative digests. no-default-features; pure computation only.
sha2 = { workspace = true }

# Test-only. The A002 dependency-direction gate exempts dev-dependencies
# (they do not ship in the crate's cone); the output-derivation
# conformance test needs a scratch directory to run real rustc into.
[dev-dependencies]
tempfile = "3.25.0"
# Test-only JSON parser: K013 golden fixtures cross-check the
# production discriminator scanner against a real parser. The A002
# gate exempts dev-dependencies; nothing here ships.
serde_json = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
