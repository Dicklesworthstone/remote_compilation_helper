[package]
name = "rabs-wkr"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "RABS trusted worker daemon: sandboxed execution, staging, prepared-result offers (never commits)"
publish = false

[lib]
doctest = false

# Specialized trusted worker — deliberately NOT a mode added to a broad
# generic daemon (plan rejects extending atpd). Composes the domain crates
# and (via rabs-asupersync) the runtime.
[dependencies]
rabs-protocol = { path = "../rabs-protocol" }
rabs-action = { path = "../rabs-action" }
rabs-key = { path = "../rabs-key" }
rabs-cas = { path = "../rabs-cas" }
rabs-sandbox = { path = "../rabs-sandbox" }
rabs-asupersync = { path = "../rabs-asupersync" }
sha2 = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
# Anonymous, session-owned diagnostic snapshots; same version as the test graph.
tempfile = "3.25.0"
# Direct runtime dependency (imports moved off the adapter re-export to
# satisfy the I14 boundary test; pin matches rabs-asupersync's A003 rule).
asupersync = { version = "=0.5.0", git = "https://github.com/Dicklesworthstone/asupersync.git", rev = "78b64636e99fea4ea2d868096576021dd3b8e519", default-features = false, features = ["proc-macros"] }

[target.'cfg(target_os = "linux")'.dependencies]
# The explicit local Cargo-root helper uses safe descriptor-relative cgroup
# access, pidfd signal delivery, and process signal flags; no pre_exec hooks.
rustix = { version = "1.1.4", features = ["fs", "process"] }
signal-hook = "0.4.4"

[dev-dependencies]
tempfile = "3.25.0"

[lints.rust]
unsafe_code = "forbid"

[[bin]]
name = "rabs-wkr"
path = "src/main.rs"

[[bin]]
name = "rabs-cargo-root"
path = "src/bin/rabs-cargo-root.rs"
